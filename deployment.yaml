apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
        - name: task-tracker
          image: pshyam910/task-tracker:latest
          ports:
            - containerPort: 5000